# Публикация статической SPA на GitHub Pages.
# Данные по-прежнему читаются/пишутся через GitLab API из браузера.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статику
        run: |
          mkdir -p _site
          cp -r index.html commands.yaml css js vendor _site/
          # На Pages локальный стенд недоступен — всегда режим GitLab.
          sed 's/^test_local:.*/test_local: false/' config.yaml > _site/config.yaml
          touch _site/.nojekyll

      - name: Проверить сборку
        run: |
          grep -q '^test_local: false$' _site/config.yaml
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/vendor/exceljs.min.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

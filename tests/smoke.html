<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Smoke test</title>
</head>
<body>
    <pre id="results"></pre>
    <div id="tree"></div>
    <div id="sheet-tabs"></div>
    <div id="table-container"></div>

    <script src="../vendor/exceljs.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/mode.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/github-api.js"></script>
    <script src="../js/local-api.js"></script>
    <script src="../js/converter.js"></script>
    <script src="../js/tree.js"></script>
    <script src="../js/view.js"></script>
    <script src="../js/dialog.js"></script>
    <script src="../js/draft.js"></script>
    <script src="../js/commands.js"></script>
    <script src="../js/complete.js"></script>
    <script src="../js/core.js"></script>
    <script>
        const results = [];
        const REAL_FETCH = window.fetch.bind(window);
        function assert(cond, msg) {
            if (!cond) throw new Error(msg || 'assertion failed');
        }
        async function check(name, fn) {
            try {
                const r = await fn();
                if (r === false) throw new Error('assertion returned false');
                results.push({ name, ok: true });
            } catch (e) {
                results.push({ name, ok: false, error: e.message });
            }
        }

        function b64utf8(s) {
            const bytes = new TextEncoder().encode(s);
            let binary = '';
            bytes.forEach(b => { binary += String.fromCharCode(b); });
            return btoa(binary);
        }

        function unb64utf8(s) {
            const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
            return new TextDecoder('utf-8').decode(bytes);
        }

        function stubFetch(handler, log) {
            window.fetch = async (url, opts = {}) => {
                const method = (opts.method || 'GET').toUpperCase();
                if (log) log.push({ url: String(url), method, body: opts.body });
                return handler(String(url), method, opts);
            };
        }

        function jsonResponse(obj, status = 200, headers = {}) {
            return new Response(JSON.stringify(obj), {
                status,
                headers: Object.assign({ 'Content-Type': 'application/json' }, headers)
            });
        }

        const SAMPLE = JSON.stringify({
            sheets: [
                {
                    name: 'Данные',
                    data: [['Товар', 'Цена'], ['Яблоко', '100']],
                    fonts: { '0:0': { bold: true } },
                    colWidths: { '1': 16.5, '2': 11 }
                },
                { name: 'Лист2', data: [['x', 'y'], ['1', '2']] }
            ]
        }, null, 2);

        (async () => {
            // --- Config ---
            await check('Config.parse: читает YAML-пары и флаги', () => {
                const cfg = Config.parse('# comment\ntest_local: true\nlocal_api: "http://127.0.0.1:8787"\n');
                assert(cfg.test_local === true, 'test_local не распознан');
                assert(cfg.local_api === 'http://127.0.0.1:8787', 'local_api не распознан');
            });

            // --- Converter.parse ---
            await check('Mode.isLocal: только loopback при test_local=true', () => {
                assert(Mode.isLocal({ test_local: true }, '127.0.0.1'), '127.0.0.1');
                assert(Mode.isLocal({ test_local: true }, 'localhost'), 'localhost');
                assert(Mode.isLocal({ test_local: true }, '::1'), '::1');
                assert(Mode.isLocal({ test_local: true }, '[::1]'), '[::1]');
                assert(Mode.isLocal({ test_local: true }, 'LOCALHOST'), 'регистр');
                assert(!Mode.isLocal({ test_local: true }, 'user.github.io'), 'github.io');
                assert(!Mode.isLocal({ test_local: true }, '192.168.1.5'), 'LAN');
                assert(!Mode.isLocal({ test_local: false }, '127.0.0.1'), 'test_local=false');
                assert(!Mode.isLocal(null, '127.0.0.1'), 'нет конфига');
            });

            await check('Converter.parse: валидный JSON', () => {
                const obj = Converter.parse('{"sheets":[{"name":"S1","data":[["a","b"]]}]}');
                assert(obj.sheets.length === 1, 'ожидался 1 лист');
                assert(obj.sheets[0].data[0][1] === 'b', 'значение ячейки');
                assert(obj.sheets[0].fonts, 'fonts должны быть по умолчанию');
            });

            await check('Converter.parse: отвергает чужой формат', () => {
                let threw = false;
                try { Converter.parse('{"foo":1}'); } catch (e) { threw = true; }
                assert(threw, 'должно было бросить исключение');
            });

            // --- ExcelJS round-trip ---
            await check('Converter: xlsx → json → xlsx с кириллицей, bold и ширинами', async () => {
                const wb = new ExcelJS.Workbook();
                const ws1 = wb.addWorksheet('Данные');
                ws1.addRow(['Товар', 'Цена']);
                ws1.addRow(['Яблоко', '100']);
                ws1.getCell('A1').font = { bold: true };
                ws1.getColumn(1).width = 18.5;

                const buffer = await wb.xlsx.writeBuffer();
                const parsed = Converter.parse(await Converter.xlsxToJson(buffer));

                assert(parsed.sheets[0].name === 'Данные', 'имя листа');
                assert(parsed.sheets[0].data[1][0] === 'Яблоко', 'кириллица');
                assert(parsed.sheets[0].fonts['0:0'].bold === true, 'bold не сохранён');
                assert(Math.abs(parsed.sheets[0].colWidths['1'] - 18.5) < 0.01, 'ширина не сохранена');

                const back = await Converter.jsonToXlsx(parsed);
                const recheck = new ExcelJS.Workbook();
                await recheck.xlsx.load(back);
                const ws2 = recheck.getWorksheet('Данные');
                assert(ws2.getCell('A1').font.bold === true, 'bold не восстановлен');
                assert(Math.abs(ws2.getColumn(1).width - 18.5) < 0.15,
                    'ширина не восстановлена: ' + ws2.getColumn(1).width);
            });

            await check('Converter: реальный sandbox/excel/test.xlsx', async () => {
                const res = await fetch('../sandbox/excel/test.xlsx');
                assert(res.ok, 'не удалось загрузить test.xlsx: ' + res.status);
                const parsed = Converter.parse(await Converter.xlsxToJson(await res.arrayBuffer()));

                const hasBold = parsed.sheets.some(s =>
                    Object.values(s.fonts || {}).some(f => f.bold));
                const hasWidths = parsed.sheets.some(s => Object.keys(s.colWidths || {}).length > 0);
                assert(hasBold, 'в test.xlsx не найден bold');
                assert(hasWidths, 'в test.xlsx не найдены ширины столбцов');
            });

            await check('Converter: фон fill и merges через xlsx', async () => {
                const json = {
                    sheets: [{
                        name: 'Style',
                        data: [['a', 'b'], ['c', 'd']],
                        fonts: { '0:0': { fill: 'FF0000' } },
                        merges: [{ r0: 1, c0: 0, r1: 1, c1: 1 }]
                    }]
                };
                const buffer = await Converter.jsonToXlsx(json);
                const parsed = Converter.parse(await Converter.xlsxToJson(buffer));

                assert(parsed.sheets[0].fonts['0:0'].fill === 'FF0000', 'fill потерян');
                const merges = parsed.sheets[0].merges || [];
                assert(merges.length === 1 && merges[0].r0 === 1 && merges[0].c1 === 1,
                    'merges потеряны: ' + JSON.stringify(merges));
            });

            await check('Converter: рамки thin через xlsx', async () => {
                const json = { sheets: [{ name: 'B', data: [['x']], borders: { '0:0': { up: 1, right: 1 } } }] };
                const parsed = Converter.parse(await Converter.xlsxToJson(await Converter.jsonToXlsx(json)));
                const b = (parsed.sheets[0].borders || {})['0:0'];
                assert(b && b.up && b.right && !b.down && !b.left, JSON.stringify(b));
            });

            await check('Converter: периметр union переживает xlsx-экспорт', async () => {
                const json = {
                    sheets: [{
                        name: 'M',
                        data: [['a', 'b'], ['c', 'd']],
                        merges: [{ r0: 0, c0: 0, r1: 1, c1: 1 }],
                        borders: {
                            '0:0': { up: 1, left: 1 },
                            '0:1': { up: 1, right: 1 },
                            '1:0': { down: 1, left: 1 },
                            '1:1': { down: 1, right: 1 }
                        }
                    }]
                };
                const parsed = Converter.parse(await Converter.xlsxToJson(await Converter.jsonToXlsx(json)));
                const b = (parsed.sheets[0].borders || {})['0:0'];
                assert(b && b.up && b.down && b.left && b.right,
                    'мастер-ячейка без периметра: ' + JSON.stringify(b));
            });

            await check('Converter: высота строк в xlsx, zoom не экспортируется', async () => {
                const json = { sheets: [{ name: 'H', data: [['x']], rowHeights: { '1': 40 }, zoom: 2 }] };
                const parsed = Converter.parse(await Converter.xlsxToJson(await Converter.jsonToXlsx(json)));
                const h = Number((parsed.sheets[0].rowHeights || {})['1']);
                assert(Math.abs(h - 40) <= 1, 'высота: ' + h);
                assert(!parsed.sheets[0].zoom, 'zoom не должен ехать в xlsx');
            });

            // --- GitLab API ---
            await check('GitLabAPI.init: разбирает URL проекта', () => {
                GitLabAPI.init('https://gitlab.example.com/group/sub/project/', 'tok', 'dev');
                assert(GitLabAPI.isInitialized(), 'адаптер должен быть инициализирован');
                assert(GitLabAPI.ref === 'dev', 'ref должен сохраниться');
            });

            await check('GitLabAPI.getTree: обходит пагинацию', async () => {
                const log = [];
                stubFetch((url) => {
                    const page = new URL(url).searchParams.get('page');
                    if (page === '1') {
                        return jsonResponse([{ name: 'a.json', path: 'a.json', type: 'blob' }],
                            200, { 'X-Next-Page': '2' });
                    }
                    return jsonResponse([{ name: 'b.json', path: 'b.json', type: 'blob' }], 200);
                }, log);

                const items = await GitLabAPI.getTree('');
                assert(items.length === 2, 'ожидалось 2 элемента');
                assert(log.length === 2, 'ожидалось 2 запроса');
            });

            await check('GitLabAPI.readFile: base64 → UTF-8 и last_commit_id', async () => {
                stubFetch(() => jsonResponse({ content: b64utf8(SAMPLE), last_commit_id: 'cmp-1' }));
                const file = await GitLabAPI.readFile('data/a.json');
                assert(file.lastCommitId === 'cmp-1', 'last_commit_id не получен');
                assert(file.content.includes('Яблоко'), 'кириллица декодирована неверно');
            });

            await check('GitLabAPI.saveFile: передаёт last_commit_id', async () => {
                const log = [];
                stubFetch(() => jsonResponse({ file_path: 'data/a.json' }), log);
                await GitLabAPI.saveFile('data/a.json', '{}', 'msg', 'cmp-1', false);
                assert(log[0].method === 'PUT', 'ожидался PUT');
                assert(JSON.parse(log[0].body).last_commit_id === 'cmp-1', 'id не передан');
            });

            await check('GitLabAPI.saveFile: 400 про конфликт → конфликт', async () => {
                stubFetch(() => jsonResponse({
                    message: 'You are attempting to update a file that has changed since you started editing it.'
                }, 400));
                let err = null;
                try { await GitLabAPI.saveFile('data/a.json', '{}', 'msg', 'old', false); }
                catch (e) { err = e; }
                assert(err && err.conflict, 'ожидалась ошибка конфликта');
            });

            await check('GitLabAPI.saveFile: 400 по другой причине → не конфликт', async () => {
                stubFetch(() => jsonResponse({ message: 'Branch not found' }, 400));
                let err = null;
                try { await GitLabAPI.saveFile('data/a.json', '{}', 'msg', null, true); }
                catch (e) { err = e; }
                assert(err && !err.conflict, 'не должно быть конфликта');
                assert(/Branch not found/.test(err.message), 'текст ошибки потерян');
            });

            // --- LocalAPI ---
            await check('LocalAPI: дерево, чтение и сохранение', async () => {
                LocalAPI.init('http://127.0.0.1:8787');
                const log = [];
                stubFetch((url, method) => {
                    if (url.includes('/api/tree')) {
                        return jsonResponse([{ name: 'a.json', path: 'a.json', type: 'blob' }]);
                    }
                    if (method === 'GET') {
                        return jsonResponse({ content: b64utf8(SAMPLE), last_commit_id: 'h1' });
                    }
                    return jsonResponse({ file_path: 'demo/a.json' });
                }, log);

                const items = await LocalAPI.getTree('');
                assert(items.length === 1, 'дерево не получено');
                const file = await LocalAPI.readFile('demo/a.json');
                assert(file.content.includes('Яблоко') && file.lastCommitId === 'h1', 'чтение неверно');

                await LocalAPI.saveFile('demo/a.json', '{}', '', 'h1', false);
                const put = log.find(r => r.method === 'PUT');
                assert(put && JSON.parse(put.body).last_commit_id === 'h1', 'PUT неверен');

                await LocalAPI.saveFile('demo/new.json', '{}', '', null, true);
                assert(log.some(r => r.method === 'POST'), 'создание должно идти через POST');
            });

            // --- GitHub API ---
            await check('GitHubAPI.init: owner/repo и URL', () => {
                GitHubAPI.init('https://github.com/owner/repo', 'tok', 'dev');
                assert(GitHubAPI.isInitialized(), 'не инициализирован');
                assert(GitHubAPI.owner === 'owner' && GitHubAPI.repo === 'repo', 'owner/repo');
                assert(GitHubAPI.ref === 'dev', 'ref');

                GitHubAPI.init('owner/repo', 'tok');
                assert(GitHubAPI.isInitialized() && GitHubAPI.ref === 'main', 'короткая форма');

                let err = null;
                try { GitHubAPI.init('owner', 'tok'); } catch (e) { err = e; }
                assert(err && /owner\/repo|репозиторий/i.test(err.message),
                    'ошибка формата: ' + (err && err.message));
            });

            await check('GitHubAPI.getTree: папка и фильтр JSON', async () => {
                GitHubAPI.init('owner/repo', 'tok', 'dev');
                const log = [];
                stubFetch(() => jsonResponse({
                    tree: [
                        { path: 'data', type: 'tree' },
                        { path: 'data/a.json', type: 'blob' },
                        { path: 'data/img.png', type: 'blob' },
                        { path: 'readme.md', type: 'blob' },
                        { path: 'other/b.json', type: 'blob' }
                    ]
                }), log);

                const items = await GitHubAPI.getTree('data');
                const paths = items.map(i => i.path).sort();
                assert(paths.join(',') === 'data,data/a.json', 'элементы: ' + paths.join(','));
                assert(log[0].url.includes('/repos/owner/repo/git/trees/dev?recursive=1'),
                    'URL: ' + log[0].url);
            });

            await check('GitHubAPI: подсказка про ветку при 404 и 422', async () => {
                GitHubAPI.init('owner/repo', 'tok', 'main');
                stubFetch((url) => {
                    if (url.includes('/git/trees/')) return jsonResponse({ message: 'Not Found' }, 404);
                    if (url.includes('/branches')) {
                        return jsonResponse([{ name: 'main' }, { name: 'gh-pages' }]);
                    }
                    throw new Error('неожиданный запрос ' + url);
                });
                let err = null;
                try { await GitHubAPI.getTree(''); } catch (e) { err = e; }
                assert(err && err.status === 404, 'нет 404: ' + (err && err.message));
                assert(/gh-pages/.test(err.message), 'нет списка веток: ' + err.message);

                stubFetch(() => jsonResponse({ message: 'Branch main not found' }, 422));
                err = null;
                try { await GitHubAPI.saveFile('a.json', '{}', 'm', null, true); } catch (e) { err = e; }
                assert(err && /ветка «main» не найдена/.test(err.message),
                    'нет подсказки: ' + (err && err.message));
            });

            await check('GitHubAPI.readFile: base64 → UTF-8 и sha', async () => {
                GitHubAPI.init('owner/repo', 'tok', 'main');
                stubFetch(() => jsonResponse({ content: b64utf8(SAMPLE), sha: 'blob-sha' }));
                const file = await GitHubAPI.readFile('data/a.json');
                assert(file.lastCommitId === 'blob-sha', 'sha');
                assert(file.content.includes('Яблоко'), 'кириллица');
            });

            await check('GitHubAPI.saveFile: PUT с sha и base64', async () => {
                GitHubAPI.init('owner/repo', 'tok', 'dev');
                const log = [];
                stubFetch(() => jsonResponse({ content: { sha: 'new' } }), log);
                await GitHubAPI.saveFile('data/a.json', SAMPLE, 'msg', 'old-sha', false);

                assert(log[0].method === 'PUT', 'метод');
                const body = JSON.parse(log[0].body);
                assert(body.sha === 'old-sha' && body.branch === 'dev', 'sha/branch');
                assert(unb64utf8(body.content) === SAMPLE, 'содержимое base64');
            });

            await check('GitHubAPI.saveFile: конфликт и создание без sha', async () => {
                GitHubAPI.init('owner/repo', 'tok', 'main');
                stubFetch(() => jsonResponse({ message: 'sha does not match' }, 409));
                let err = null;
                try { await GitHubAPI.saveFile('a.json', '{}', 'm', 'old', false); } catch (e) { err = e; }
                assert(err && err.conflict, 'нет конфликта: ' + (err && err.message));

                const log = [];
                stubFetch(() => jsonResponse({}), log);
                await GitHubAPI.saveFile('a.json', '{}', 'm', null, true);
                assert(!JSON.parse(log[0].body).sha, 'sha не должен передаваться при создании');
            });

            await check('Core + GitHub: загрузка проекта, открытие и сохранение', async () => {
                SheetView.setWorkbook(SheetView.emptyWorkbook());
                TreeView.init(document.getElementById('tree'), () => {});
                Core.init({ status: () => {}, mode: 'gitlab', provider: 'github' });

                const log = [];
                let sha = 'sha-1';
                stubFetch((url, method) => {
                    if (url.includes('/git/trees/')) {
                        return jsonResponse({
                            tree: [
                                { path: 'data', type: 'tree' },
                                { path: 'data/a.json', type: 'blob' }
                            ]
                        });
                    }
                    if (method === 'GET' && url.includes('/contents/')) {
                        return jsonResponse({ content: b64utf8(SAMPLE), sha });
                    }
                    if (method === 'PUT') {
                        sha = 'sha-2';
                        return jsonResponse({ content: { sha } });
                    }
                    throw new Error('неожиданный запрос ' + method + ' ' + url);
                }, log);

                await Core.loadProject({
                    projectUrl: 'owner/repo',
                    token: 'tok',
                    ref: 'main',
                    folder: 'data',
                    provider: 'github'
                });
                assert(Core.getMode() === 'github', 'режим: ' + Core.getMode());
                assert(document.querySelectorAll('#tree .tree-file').length === 1, 'дерево не отрисовано');

                await Core.openFile('data/a.json');
                assert(Core.getCurrentPath() === 'data/a.json', 'путь не установлен');
                assert(SheetView.getCellValue(1, 0) === 'Яблоко', 'данные: ' + SheetView.getCellValue(1, 0));

                SheetView.setCellValue(1, 0, 'Груша');
                await Core.save();

                const put = log.find(r => r.method === 'PUT');
                assert(put, 'PUT не отправлен');
                const body = JSON.parse(put.body);
                assert(body.sha === 'sha-1', 'sha: ' + body.sha);
                assert(unb64utf8(body.content).includes('Груша'), 'правка не попала в коммит');
            });

            // --- TreeView ---
            await check('TreeView.render: вложенное дерево и клик', () => {
                let selected = null;
                const el = document.getElementById('tree');
                TreeView.init(el, p => { selected = p; });
                TreeView.render([
                    { name: 'data', path: 'data', type: 'tree' },
                    { name: 'a.json', path: 'data/a.json', type: 'blob' },
                    { name: 'readme.md', path: 'readme.md', type: 'blob' },
                    { name: 'sub', path: 'data/sub', type: 'tree' },
                    { name: 'b.json', path: 'data/sub/b.json', type: 'blob' }
                ]);
                const files = el.querySelectorAll('.tree-file');
                assert(files.length === 2, 'должно быть 2 json-файла, найдено ' + files.length);
                assert(!el.textContent.includes('readme.md'), 'не-json файл попал в дерево');
                const target = Array.from(files).find(f => f.dataset.path === 'data/a.json');
                target.click();
                assert(selected === 'data/a.json', 'callback получил ' + selected);
            });

            // --- SheetView: сетка 10×50 ---
            await check('SheetView: по умолчанию 10 столбцов и 50 строк', () => {
                SheetView.init(
                    document.getElementById('sheet-tabs'),
                    document.getElementById('table-container'),
                    () => {}
                );
                SheetView.setWorkbook(SheetView.emptyWorkbook());

                const headCells = document.querySelectorAll('.excel-table thead th');
                assert(headCells.length === 11, 'ожидалось 11 заголовков (угловой + 10), найдено ' + headCells.length);
                assert(headCells[1].textContent === 'A', 'первый столбец A');
                assert(headCells[10].textContent === 'J', 'десятый столбец J');

                const dataRows = document.querySelectorAll('.excel-table tbody tr');
                assert(dataRows.length === 50, 'ожидалось 50 строк данных, найдено ' + dataRows.length);
                assert(dataRows[0].querySelector('.row-header').textContent === '1', 'нумерация с 1');
                assert(dataRows[49].querySelector('.row-header').textContent === '50', 'последняя строка 50');

                const rowHeaders = document.querySelectorAll('.excel-table tbody th.row-header');
                assert([...rowHeaders].every(th => th.contentEditable !== 'true'),
                    'заголовки строк должны быть нередактируемыми');
                const corner = document.querySelector('.excel-table thead th');
                assert(corner.contentEditable !== 'true', 'угловая ячейка нередактируема');
            });

            await check('Commands: A1 = текст, регистр и пробелы', () => {
                SheetView.setWorkbook(SheetView.emptyWorkbook());
                Commands.execute('  a1   =   Название сервиса  ');
                assert(SheetView.getCellValue(0, 0) === 'Название сервиса', 'значение не записано');
                assert(document.querySelector('td[data-row="0"][data-col="0"]').textContent === 'Название сервиса',
                    'таблица не обновилась');
            });

            await check('Commands: список через запятую и диапазон через ->', () => {
                SheetView.setWorkbook(SheetView.emptyWorkbook());
                Commands.execute('A1, B2 = список');
                assert(SheetView.getCellValue(0, 0) === 'список' && SheetView.getCellValue(1, 1) === 'список',
                    'список не применён');

                Commands.execute('A1 -> B2 = диапазон');
                assert(SheetView.getCellValue(0, 0) === 'диапазон', 'A1');
                assert(SheetView.getCellValue(0, 1) === 'диапазон', 'B1');
                assert(SheetView.getCellValue(1, 0) === 'диапазон', 'A2');
                assert(SheetView.getCellValue(1, 1) === 'диапазон', 'B2');
            });

            await check('Commands: ошибки синтаксиса и разделителя', () => {
                let err = null;
                try { Commands.execute('A1 B2 = текст'); } catch (e) { err = e; }
                assert(err && err.message === 'отсутствует разделитель', 'получено: ' + (err && err.message));

                err = null;

                Commands.execute('(A1 = текст (пояснение))+(color = red)');
                assert(SheetView.getCellValue(0, 0) === 'текст (пояснение)',
                    'скобки в значении внутри цепочки');
                assert(SheetView.getCellFont(0, 0).fill === 'FF0000', 'цвет не унаследован');
            });

            // --- Render report ---
            const failed = results.filter(r => !r.ok);
            document.getElementById('results').textContent = results
                .map(r => (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.ok ? '' : ' — ' + r.error))
                .join('\n') + '\nSUMMARY: ' + (failed.length ? 'FAIL' : 'PASS') +
                ' (' + (results.length - failed.length) + '/' + results.length + ')';
            document.body.dataset.status = failed.length ? 'fail' : 'pass';
        })();
    </script>
</body>
</html>
